<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ثبت‌نام | آموزشگاه میثاق</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">

        <img src="pc/logo.jpg">

        <div>

            <h1>آموزشگاه میثاق</h1>

            <p>ثبت‌نام دوره‌های آموزشی</p>

        </div>

    </div>

    <nav>

        <a href="index.html">خانه</a>

        <a href="courses.html">دوره‌ها</a>

        <a href="about.html">درباره ما</a>

        <a href="gallery.html">گالری</a>

        <a href="contact.html">تماس</a>

    </nav>

</header>


<main>

<section class="section">

    <h2 class="section-title">
        فرم ثبت‌نام
    </h2>

    <p class="section-description">
        اطلاعات خود را وارد کنید.
    </p>


    <form id="registerForm">


        <label>
            نام و نام خانوادگی
        </label>

        <input
            type="text"
            id="name"
            placeholder="نام خود را وارد کنید">


        <label>
            شماره موبایل
        </label>

        <input
            type="text"
            id="phone"
            placeholder="09123456789">


        <label>
            سن
        </label>

        <input
            type="number"
            id="age"
            placeholder="سن">


        <label>
            انتخاب دوره
        </label>

        <select id="course">

            <option value="">
                انتخاب کنید
            </option>

            <option>
                طراحی سایت
            </option>

            <option>
                برنامه‌نویسی پایتون
            </option>

            <option>
                فتوشاپ
            </option>

            <option>
                ICDL
            </option>

        </select>


        <button type="submit">
            ثبت‌نام
        </button>


        <div id="message"></div>

    </form>

</section>

</main>


<footer>

    <h3>
        آموزشگاه فنی و حرفه‌ای آزاد میثاق
    </h3>

    <p>
        کاشان
    </p>

</footer>


<script src="js/script.js"></script>

</body>

</html>
